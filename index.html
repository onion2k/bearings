<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Bearing</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
    --gold: #f2c14e;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #board {
    top: 16px;
    left: 16px;
    min-width: 168px;
    font-size: 13px;
  }
  /* the shelves the board can show, the runs, the catalog of pieces and the player's own, as tabs over the title */
  #shelves {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin: -2px 0 4px;
  }
  #shelves button {
    pointer-events: auto;
    border: 0;
    border-radius: 6px;
    padding: 1px 8px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #shelves button:hover {
    color: var(--ink);
  }
  #shelves button.on {
    background: rgba(255, 255, 255, 0.1);
    color: var(--ink);
  }
  #picker {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: -4px -6px 0;
  }
  /* the panels let the pointer through to the canvas, so the picker has to take it back */
  #picker button {
    pointer-events: auto;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  #picker button:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--ink);
  }
  #title {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
  }
  /* a best time, or a piece's line of what it does, wrapped to the board's width rather than stretching it */
  #best {
    max-width: 168px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  #order {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: place;
  }
  /* a row is picked by a tap, so it takes the pointer back from the canvas like the picker's arrows */
  #order li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    counter-increment: place;
    color: var(--dim);
    line-height: 1.7;
    margin: 0 -6px;
    padding: 0 6px;
    border-radius: 6px;
    pointer-events: auto;
    cursor: pointer;
  }
  #order li:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  /* who has the marble: a player's number, or an empty place the same width so the names line up */
  #order li i {
    width: 24px;
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
    border-radius: 5px;
    background: var(--gold);
    color: #19150a;
  }
  #order li i.none {
    background: transparent;
  }
  #order li::before {
    content: counter(place) '.';
    width: 16px;
    color: var(--dim);
  }
  #order li b {
    flex: 1;
    font-weight: 500;
    color: var(--ink);
  }
  #order li.won b {
    color: var(--gold);
  }
  #order span {
    font-variant-numeric: tabular-nums;
  }
  /* as wide as the board's rows and no wider: a long line wraps rather than stretching the board */
  #verdict {
    max-width: 168px;
    margin: 6px auto 0;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
  }
  #verdict:empty {
    display: none;
  }
  /* the builder: a name, every piece that can go on the end, and what is wrong with the run as it stands. Like
     the picker, everything in it takes the pointer back from the canvas */
  #build {
    width: 210px;
  }
  #build[hidden],
  #designTools[hidden],
  #picker[hidden] {
    display: none;
  }
  #designName {
    pointer-events: auto;
    width: 100%;
    margin: 0 0 6px;
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--gold);
    font: inherit;
    font-weight: 700;
    text-align: center;
  }
  #palette {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  #palette button,
  .tools button {
    pointer-events: auto;
    border: 0;
    border-radius: 6px;
    padding: 3px 4px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    line-height: 1.3;
    cursor: pointer;
  }
  #palette button:hover:not(:disabled),
  .tools button:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.16);
  }
  #palette button:disabled,
  .tools button:disabled {
    color: var(--dim);
    opacity: 0.45;
    cursor: default;
  }
  .tools {
    display: flex;
    gap: 3px;
    margin: 6px 0 2px;
  }
  .tools button {
    flex: 1;
    font-weight: 600;
  }
  /* a row of tools the page hides and shows, which a class's own display would otherwise keep in view */
  .tools[hidden] {
    display: none;
  }
  #keep:not(:disabled) {
    background: var(--gold);
    color: #19150a;
  }
  /* pressed while the last piece has a grid over it, while the next piece goes on that lane of a split, and on the
     theme the run is dressed as */
  #grid[aria-pressed='true'],
  #lanes button[aria-pressed='true'],
  #themes button[aria-pressed='true'] {
    outline: 1px solid var(--gold);
    color: var(--gold);
  }
  #problems {
    margin: 4px 0 0;
    padding: 0;
    list-style: none;
    color: var(--dim);
    font-size: 11px;
    line-height: 1.35;
  }
  #problems li + li {
    margin-top: 3px;
  }
  #problems li.sound {
    color: var(--gold);
    font-weight: 600;
    text-align: center;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  /* what each quarter of the split screen follows: a name and a dot of its colour, in the corner of the quarter
     that nothing else sits in — over the top on a wide screen, where the board and the help line have the
     left and the count the right, and at the foot of each on an upright one, where they are all gone or over it */
  #tags {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #tags[hidden] {
    display: none;
  }
  #tags .tag {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 9px 2px 7px;
    border-radius: 999px;
    background: rgba(12, 11, 18, 0.66);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    transform: translateX(-50%);
  }
  #tags .tag[hidden] {
    display: none;
  }
  #tags .tag i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* split on a phone: the board is only its header, or it covers the first views and their captions, which
     carry the players' badges themselves */
  @media (max-width: 600px) {
    #board.split #best,
    #board.split #order,
    #board.split #verdict {
      display: none;
    }
  }
  @media (max-width: 600px) {
    #help,
    #stats {
      display: none;
    }
  }
  /* building on a phone: the whole width, and the pieces one row a thumb scrolls sideways, so the builder stands
     no taller than the board does over a race and leaves the run it is building in view */
  @media (max-width: 600px) {
    #board.building {
      right: 16px;
    }
    #build {
      width: auto;
    }
    #palette {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
    }
    #palette button {
      flex: none;
      white-space: nowrap;
      padding: 4px 8px;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="board" hidden>
  <div id="shelves">
    <button id="toRuns" type="button" class="on">Runs</button>
    <button id="toPieces" type="button">Pieces</button>
    <button id="toDesigns" type="button">Designs</button>
    <button id="toSplit" type="button" aria-label="Split the screen in four or eight, each view on a marble">
      Split
    </button>
  </div>
  <div id="picker">
    <button id="prev" type="button" aria-label="The run before">‹</button>
    <div id="title"></div>
    <button id="next" type="button" aria-label="The next run">›</button>
  </div>
  <div id="best"></div>
  <div id="designTools" class="tools" hidden>
    <button id="newDesign" type="button">Build another</button>
    <button id="forget" type="button">Throw away</button>
  </div>
  <div id="build" hidden>
    <input id="designName" type="text" maxlength="32" autocomplete="off" spellcheck="false" aria-label="Its name" />
    <div id="palette"></div>
    <div id="lanes" class="tools" hidden>
      <button id="laneLeft" type="button" aria-pressed="false">Left lane</button>
      <button id="laneRight" type="button" aria-pressed="false">Right lane</button>
    </div>
    <div id="themes" class="tools">
      <button type="button" data-theme="plain" aria-pressed="true">Plain</button>
      <button type="button" data-theme="industrial" aria-pressed="false">Industrial</button>
    </div>
    <div class="tools">
      <button id="undo" type="button">Undo</button>
      <button id="grid" type="button" aria-pressed="false">Grid</button>
      <button id="keep" type="button">Keep</button>
      <button id="leave" type="button">Leave</button>
    </div>
    <ul id="problems"></ul>
  </div>
  <ol id="order"></ol>
  <div id="verdict"></div>
</div>
<div id="tags" hidden></div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>
  <span>1</span>–<span>8</span> pick a marble · <span>space</span> let them go · <span>R</span> again ·
  <span>C</span> pieces · <span>S</span> split screen · Designs to build your own · drag to orbit, wheel to zoom
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
