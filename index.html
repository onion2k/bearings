<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Bearing</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
    --gold: #f2c14e;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #board {
    top: 16px;
    left: 16px;
    min-width: 168px;
    font-size: 13px;
  }
  #picker {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: -4px -6px 0;
  }
  /* the panels let the pointer through to the canvas, so the picker has to take it back */
  #picker button {
    pointer-events: auto;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  #picker button:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--ink);
  }
  #title {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
  }
  #best {
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  #order {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: place;
  }
  #order li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    counter-increment: place;
    color: var(--dim);
    line-height: 1.7;
  }
  #order li::before {
    content: counter(place) '.';
    width: 16px;
    color: var(--dim);
  }
  #order li b {
    flex: 1;
    font-weight: 500;
    color: var(--ink);
  }
  #order li.won b {
    color: var(--gold);
  }
  #order span {
    font-variant-numeric: tabular-nums;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  @media (max-width: 600px) {
    #help,
    #stats {
      display: none;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="board" hidden>
  <div id="picker">
    <button id="prev" type="button" aria-label="The run before">‹</button>
    <div id="title"></div>
    <button id="next" type="button" aria-label="The next run">›</button>
  </div>
  <div id="best"></div>
  <ol id="order"></ol>
</div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>
  <span>space</span> let them go · <span>R</span> again · drag to orbit, wheel to zoom
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
